<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scorchio's Flat-Pack</title>
<style>
  :root{
    --bg:#f6e7cf; --panel:#fff7e8; --ink:#4a2c1c; --red:#8c2f1e; --orange:#e0642a;
    --gold:#f4b942; --smoke:#6b6157; --wood:#d9a05b; --blue:#3b5b9b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    touch-action:manipulation; overflow-x:hidden;
  }
  #app{width:100%; max-width:480px; flex:1; display:flex; flex-direction:column; padding:12px 14px 80px;}

  header{display:flex; align-items:center; gap:8px; justify-content:center; padding:6px 0 10px;}
  header .flame{font-size:22px; line-height:1;}
  header h1{font-size:19px; letter-spacing:1px; color:var(--red);}
  header .sub{font-size:11px; color:var(--smoke); letter-spacing:2px; margin-top:2px; text-align:center;}

  .sign{background:var(--red); color:#ffe9c9; text-align:center; font-size:11px; letter-spacing:1.5px;
    padding:7px 10px; border-radius:10px; margin-bottom:12px; box-shadow:0 2px 0 #5e1d12;}

  /* STORE */
  .store h2{font-size:15px; color:var(--smoke); text-align:center; margin-bottom:10px; font-weight:600;}
  .shelf{display:flex; flex-direction:column; gap:12px;}
  .boxcard{
    background:var(--panel); border:3px solid var(--red); border-radius:16px; padding:10px 12px;
    display:flex; align-items:center; gap:12px; cursor:pointer; box-shadow:0 3px 0 rgba(140,47,30,.25);
    transition:transform .12s ease;
  }
  .boxcard:active{transform:scale(.98);}
  .boxcard svg{width:74px; height:74px; flex-shrink:0;}
  .boxcard .info{flex:1;}
  .boxcard .name{font-size:17px; font-weight:800; color:var(--red);}
  .boxcard .kind{font-size:11px; color:var(--smoke); letter-spacing:1px; text-transform:uppercase; margin:2px 0 4px;}
  .boxcard .pitch{font-size:12.5px; line-height:1.35;}
  .boxcard .price{margin-top:5px; font-size:12px; color:var(--orange); font-weight:700;}
  .hint{text-align:center; font-size:11.5px; color:var(--smoke); margin-top:12px;}

  /* BUILD */
  .build{display:flex; flex-direction:column; flex:1;}
  .build-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .back{background:none; border:2px solid var(--smoke); color:var(--smoke); border-radius:10px; font-size:12px;
    font-weight:700; padding:5px 10px; margin-bottom:8px; cursor:pointer; font-family:inherit;}
  .build-top .pname{font-size:16px; font-weight:800; color:var(--red);}
  .build-top .progress{font-size:12px; color:var(--smoke); font-weight:600;}
  .bench{
    position:relative; background:linear-gradient(180deg,#e7c088,#d9a05b); border:3px solid #8c2f1e;
    border-radius:16px; padding:8px; overflow:hidden; box-shadow:inset 0 4px 0 rgba(255,255,255,.35), 0 3px 0 rgba(140,47,30,.25);
  }
  .bench .woodline{position:absolute; left:0; right:0; height:2px; background:rgba(140,47,30,.15);}
  .scene{width:100%; height:auto; aspect-ratio:320/230; display:block; position:relative; z-index:1;}
  .scene .p{transform-box:fill-box; transform-origin:center; filter:grayscale(1) opacity(.38); transition:filter .35s ease, opacity .35s ease;}
  .scene .p.on{filter:none; opacity:1;}
  .scene .p.on.pop{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(.94);} 55%{transform:scale(1.06);} 100%{transform:scale(1);}}
  .bench.glow .scene .p.on{filter:drop-shadow(0 0 10px rgba(244,185,66,.9));}
  .fireoverlay{position:absolute; inset:0; z-index:5; pointer-events:none;}
  .fireoverlay span{position:absolute; bottom:-10%; font-size:22px; animation:rise 1.6s ease-out forwards;}
  @keyframes rise{0%{transform:translateY(0) scale(.7); opacity:0;} 15%{opacity:.95;} 100%{transform:translateY(-105%) scale(1.25); opacity:0;}}

  .tray{display:flex; gap:8px; padding:12px 0 8px; flex-wrap:wrap;}
  .partcard{
    background:var(--panel); border:2.5px solid var(--orange); border-radius:12px; padding:6px 8px 4px;
    flex:1 1 calc(25% - 8px); min-width:70px; text-align:center; cursor:pointer; position:relative;
    box-shadow:0 2px 0 rgba(224,100,42,.25); transition:transform .1s ease;
  }
  .partcard:active{transform:scale(.95);}
  .partcard svg{width:44px; height:44px; display:block; margin:0 auto;}
  .partcard .n{
    position:absolute; top:-7px; left:-7px; width:20px; height:20px; border-radius:50%;
    background:var(--red); color:#ffe9c9; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .partcard .label{font-size:10px; color:var(--smoke); margin-top:2px; line-height:1.2;}
  .partcard.done{border-color:var(--gold); opacity:.55;}
  .partcard.shake{animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 50%{transform:translateX(6px);} 75%{transform:translateX(-3px);}}

  .nudge{text-align:center; font-size:12px; color:var(--red); min-height:16px; font-weight:600;}

  .breathe-btn{
    margin:4px 0 8px; padding:14px; border:none; border-radius:14px; background:var(--orange); color:#fff3df;
    font-size:17px; font-weight:800; letter-spacing:1px; cursor:pointer; box-shadow:0 4px 0 #a8431c;
    transition:transform .1s ease; display:none;
  }
  .breathe-btn:active{transform:translateY(2px); box-shadow:0 2px 0 #a8431c;}
  .breathe-btn.show{display:block;}

  .finish{
    display:none; background:var(--panel); border:3px solid var(--gold); border-radius:16px;
    padding:14px; text-align:center; margin-top:10px; box-shadow:0 3px 0 rgba(244,185,66,.5);
  }
  .finish.show{display:block; animation:pop .4s ease;}
  .finish .fname{font-size:20px; font-weight:900; color:var(--red);}
  .finish .ftag{font-size:13px; color:var(--smoke); margin:4px 0 10px;}
  .bigbtn{
    border:none; border-radius:12px; padding:12px 16px; font-size:15px; font-weight:800; cursor:pointer;
    background:var(--blue); color:#fff; box-shadow:0 3px 0 #2c446f;
  }
  .bigbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #2c446f;}
  .bigbtn.warm{background:var(--red); box-shadow:0 3px 0 #5e1d12;}

  /* BAG */
  .bagwrap{position:fixed; bottom:14px; right:14px; z-index:20; display:flex; align-items:center; gap:6px;
    background:var(--panel); border:2.5px solid var(--blue); border-radius:14px; padding:6px 10px 6px 6px;
    box-shadow:0 3px 0 rgba(59,91,155,.35);}
  .bagwrap svg{width:34px; height:34px;}
  .bagwrap .cnt{font-size:13px; font-weight:800; color:var(--blue);}
  .bagwrap.pop{animation:pop .45s ease;}

  /* RECEIPT */
  .receipt{background:var(--panel); border:3px solid var(--red); border-radius:16px; padding:18px;
    margin-top:8px; box-shadow:0 3px 0 rgba(140,47,30,.25);}
  .receipt h2{text-align:center; font-size:14px; letter-spacing:3px; color:var(--smoke);}
  .receipt .items{margin:12px 0; list-style:none;}
  .receipt .items li{display:flex; justify-content:space-between; padding:7px 2px; border-bottom:1px dashed #d9c29a; font-size:14px;}
  .receipt .items li .ok{color:var(--orange); font-weight:800;}
  .receipt .total{display:flex; justify-content:space-between; font-weight:900; font-size:15px; padding-top:8px;}
  .receipt .note{margin-top:12px; text-align:center; font-size:12.5px; color:var(--smoke); font-style:italic;}
  .marsh{display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:14px;}
  .marsh .stick{display:flex; align-items:center;}
  .marsh svg{width:74px; height:90px;}
  .marsh .toast{font-size:12px; color:var(--smoke); min-height:15px;}
  .receipt .again{margin-top:14px; width:100%;}

  footer{margin-top:auto; padding-top:10px; text-align:center; font-size:10.5px; color:var(--smoke); letter-spacing:.5px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  "use strict";
  var app = document.getElementById("app");
  var S = { screen:"store", product:null, placed:0, bag:[], busy:false };

  /* ---------- sound (tiny, safe) ---------- */
  var AC = null;
  const audio = () => {
    try{
      if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); }
      if(AC.state === "suspended"){ AC.resume(); }
      return AC;
    }catch(e){ return null; }
  }
  const tone = (freqFrom, freqTo, dur, type, vol) => {
    var ctx = audio(); if(!ctx) return;
    try{
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freqFrom, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(freqTo,1), ctx.currentTime + dur);
      g.gain.setValueAtTime(vol||0.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur + 0.02);
    }catch(e){}
  }
  const whoosh = () => {
    var ctx = audio(); if(!ctx) return;
    try{
      var len = Math.floor(ctx.sampleRate * 1.1), buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1) * (1 - i/len); }
      var src = ctx.createBufferSource(); src.buffer = buf;
      var f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(300, ctx.currentTime);
      f.frequency.exponentialRampToValueAtTime(2400, ctx.currentTime + 1.0); f.Q.value = 0.9;
      var g = ctx.createGain(); g.gain.value = 0.25;
      src.connect(f); f.connect(g); g.connect(ctx.destination); src.start();
    }catch(e){}
  }
  document.addEventListener("pointerdown", () => { audio(); }, { once:true });

  /* ---------- products ---------- */
  var PRODUCTS = [
    {
      id:"laga", name:"LÅGA", kind:"the couch that knows",
      pitch:"Already the right temperature. You sit down, it just knows.",
      price:"5 coals", icon:'<rect x="26" y="30" width="48" height="16" rx="6" fill="#c2552a"/><rect x="22" y="46" width="56" height="12" rx="6" fill="#d96a33"/><rect x="16" y="38" width="10" height="22" rx="4" fill="#b4532a"/><rect x="74" y="38" width="10" height="22" rx="4" fill="#b4532a"/>',
      tagline:"Sit down. It just knows.",
      parts:[
        { label:"Back", svg:'<rect x="8" y="6" width="84" height="64" rx="16" fill="#c2552a"/><rect x="18" y="16" width="30" height="34" rx="10" fill="#a8441f"/><rect x="52" y="16" width="30" height="34" rx="10" fill="#a8441f"/>', place:{x:64,y:30,s:2} },
        { label:"Seat", svg:'<rect x="6" y="10" width="88" height="40" rx="14" fill="#d96a33"/><rect x="16" y="18" width="68" height="18" rx="9" fill="#e3824e" opacity="0.7"/>', place:{x:58,y:142,s:2} },
        { label:"Left arm", svg:'<rect x="10" y="8" width="46" height="88" rx="16" fill="#b4532a"/><path d="M33 30 C 24 44, 36 52, 30 66 C 42 58, 48 46, 42 34 C 40 30, 36 28, 33 30 Z" fill="#f4b942"/>', place:{x:16,y:84,s:1} },
        { label:"Right arm", svg:'<rect x="10" y="8" width="46" height="88" rx="16" fill="#b4532a"/><circle cx="33" cy="42" r="10" fill="#f4b942"/>', place:{x:242,y:84,s:1} },
        { label:"Coal feet", svg:'<circle cx="16" cy="22" r="9" fill="#4a3f38"/><circle cx="50" cy="22" r="9" fill="#4a3f38"/><circle cx="84" cy="22" r="9" fill="#4a3f38"/><circle cx="50" cy="6" r="4" fill="#f4b942" opacity="0.85"/>', place:{x:92,y:204,s:1} },
        { label:"Warm spot", svg:'<rect x="30" y="10" width="40" height="26" rx="10" fill="#f4b942"/><path d="M50 14 C 46 20, 54 22, 50 30" stroke="#e09a1f" stroke-width="3" fill="none" stroke-linecap="round"/>', place:{x:52,y:146,s:2} }
      ]
    },
    {
      id:"rok", name:"RÖK", kind:"the smoke detector",
      pitch:"Only goes off when the smoke STOPS. Silence is the emergency.",
      price:"4 coals", icon:'<path d="M34 44 a16 16 0 0 1 32 0 z" fill="#e8e0d2" stroke="#8c2f1e" stroke-width="2.5"/><rect x="36" y="34" width="28" height="8" rx="4" fill="#6b6157"/><circle cx="42" cy="52" r="4" fill="#d6453f"/>',
      tagline:"Silence is the emergency.",
      parts:[
        { label:"Ceiling mount", svg:'<rect x="18" y="8" width="64" height="16" rx="8" fill="#5b5248"/><rect x="30" y="4" width="40" height="8" rx="4" fill="#4a3f38"/>', place:{x:118,y:22,s:1} },
        { label:"Dome", svg:'<path d="M10 52 a40 40 0 0 1 80 0 z" fill="#e8e0d2" stroke="#cfc4b0" stroke-width="3"/><circle cx="50" cy="34" r="6" fill="#d8cfbd" stroke="#cfc4b0" stroke-width="2"/>', place:{x:118,y:30,s:1} },
        { label:"LED & button", svg:'<circle cx="36" cy="26" r="8" fill="#d6453f"/><rect x="48" y="20" width="20" height="12" rx="6" fill="#6b6157"/>', place:{x:116,y:48,s:1} },
        { label:"The sign", svg:'<line x1="50" y1="0" x2="50" y2="16" stroke="#8c2f1e" stroke-width="3"/><rect x="10" y="16" width="80" height="50" rx="10" fill="#fff7e8" stroke="#8c2f1e" stroke-width="4"/><circle cx="28" cy="41" r="8" fill="#d6453f"/><rect x="44" y="36" width="40" height="10" rx="5" fill="#8c2f1e"/>', place:{x:132,y:84,s:1} }
      ]
    },
    {
      id:"rodhaj", name:"RÖDHAJ", kind:"the red shark",
      pitch:"Fireproof, and warm to hug no matter how long it's been on the shelf.",
      price:"6 coals", icon:'<path d="M22 52 C 23 42, 34 38, 44 46 C 50 50, 49 56, 42 60 C 32 64, 22 60, 22 52 Z" fill="#c0392b"/><path d="M42 48 C 46 42, 52 40, 54 44 C 51 46, 48 48, 42 48 Z" fill="#a93226"/><circle cx="31" cy="50" r="1.8" fill="#2b1d16"/>',
      tagline:"Sells out first, every restock.",
      parts:[
        { label:"Body", svg:'<path d="M8 58 C 10 26, 62 14, 96 40 C 110 52, 106 70, 80 80 C 48 92, 10 82, 8 58 Z" fill="#c0392b"/>', place:{x:36,y:66,s:1} },
        { label:"Belly", svg:'<path d="M22 64 C 34 78, 60 82, 80 72 C 88 68, 90 58, 82 54 C 64 66, 38 62, 22 64 Z" fill="#f7e8d0"/>', place:{x:36,y:66,s:1} },
        { label:"Fin", svg:'<path d="M58 34 C 62 8, 84 10, 82 36 C 74 26, 66 26, 58 34 Z" fill="#a93226"/>', place:{x:40,y:58,s:1} },
        { label:"Tail", svg:'<path d="M92 42 C 104 30, 116 22, 126 28 C 118 40, 120 52, 124 66 C 112 72, 102 62, 94 54 Z" fill="#a93226"/>', place:{x:50,y:72,s:1} },
        { label:"Face", svg:'<circle cx="30" cy="46" r="6" fill="#2b1d16"/><path d="M20 62 Q 30 70 40 62" stroke="#2b1d16" stroke-width="4" fill="none" stroke-linecap="round"/>', place:{x:40,y:66,s:1} }
      ]
    }
  ];

  /* ---------- render helpers ---------- */
  const el = (html) => { var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
  const header = (back) => {
    var h = '<header><div class="flame">🔥</div><div><h1>SCORCHIO\'S FLAT-PACK</h1><div class="sub">BUILD IT YOURSELF. BREATHE ON IT.</div></div></header>';
    return h;
  }
  const bagHTML = () => {
    return '<div class="bagwrap" id="bagwrap"><svg viewBox="0 0 100 100"><path d="M38 30 c0 -16 24 -16 24 0" stroke="#2c446f" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M16 34 h68 l-6 52 a10 10 0 0 1 -10 9 h-36 a10 10 0 0 1 -10 -9 z" fill="#3b5b9b" stroke="#2c446f" stroke-width="4"/></svg><span class="cnt" id="bagcnt">' + S.bag.length + '/3</span></div>';
  }
  const sceneSVG = (prod) => {
    var gs = prod.parts.map((p,i) => {
      var on = i < S.placed ? " on" : "";
      return '<g transform="translate(' + p.place.x + ' ' + p.place.y + ') scale(' + p.place.s + ')"><g class="p' + on + '" data-i="' + i + '">' + p.svg + '</g></g>';
    }).join("");
    return '<svg class="scene" viewBox="0 0 320 230" xmlns="http://www.w3.org/2000/svg">' + gs + '</svg>';
  }

  /* ---------- screens ---------- */
  const renderStore = () => {
    S.screen = "store";
    var cards = PRODUCTS.map((p) => {
      return '<div class="boxcard" data-id="' + p.id + '">' +
        '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
          '<rect x="12" y="26" width="76" height="62" rx="8" fill="#d9a05b" stroke="#8c2f1e" stroke-width="3"/>' +
          '<path d="M12 42 L 50 54 L 88 42" stroke="#8c2f1e" stroke-width="3" fill="none"/>' +
          '<path d="M50 54 L 50 88" stroke="#8c2f1e" stroke-width="3"/>' +
          p.icon +
        '</svg>' +
        '<div class="info"><div class="name">' + p.name + '</div><div class="kind">' + p.kind + '</div>' +
        '<div class="pitch">' + p.pitch + '</div><div class="price">' + p.price + '</div></div></div>';
    }).join("");
    app.innerHTML = header() +
      '<div class="store"><div class="sign">WELCOME. THE STORE IS ONE BIG HEARTH.</div>' +
      '<h2>Pick a flat-pack. The picture on the box is the whole manual.</h2>' +
      '<div class="shelf">' + cards + '</div>' +
      '<div class="hint">Assembly instructions: one picture. Step two: done.</div></div>' +
      bagHTML() + footerHTML();
    document.querySelectorAll(".boxcard").forEach((c) => {
      c.addEventListener("click", () => {
        var p = PRODUCTS.find((x) => { return x.id === c.getAttribute("data-id"); });
        if(p){ S.product = p; S.placed = 0; S.busy = false; renderBuild(); }
      });
    });
  }
  const footerHTML = () => {
    return '<footer>ALL PARTS ARE TESTED. SOME BROKE. ALL ARE MINE.</footer>';
  }
  const renderBuild = () => {
    var p = S.product;
    S.screen = "build";
    var cards = p.parts.map((part,i) => {
      var done = i < S.placed ? " done" : "";
      return '<div class="partcard' + done + '" data-i="' + i + '">' +
        '<span class="n">' + (i+1) + '</span>' +
        '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' + part.svg + '</svg>' +
        '<div class="label">' + part.label + '</div></div>';
    }).join("");
    app.innerHTML = header() +
      '<div class="build">' +
        '<div class="sign">ASSEMBLY INSTRUCTIONS: ONE PICTURE. ONE BREATH.</div>' +
        '<div class="build-top"><div class="pname">' + p.name + ' · ' + p.kind + '</div>' +
        '<div class="progress" id="prog">0/' + p.parts.length + '</div></div>' +
        '<button class="back" id="back">← shelve it</button>' +
        '<div class="bench" id="bench">' + sceneSVG(p) + '<div class="fireoverlay" id="fire"></div></div>' +
        '<div class="nudge" id="nudge">Tap the numbered parts. They go where the picture says.</div>' +
        '<div class="tray" id="tray">' + cards + '</div>' +
        '<button class="breathe-btn" id="breathe">BREATHE ON IT 🔥</button>' +
        '<div class="finish" id="finish"></div>' +
      '</div>' + bagHTML() + footerHTML();
    document.querySelectorAll(".partcard").forEach((c) => {
      c.addEventListener("click", () => { tryPart(c); });
    });
    document.getElementById("breathe").addEventListener("click", breathe);
    document.getElementById("back").addEventListener("click", () => { renderStore(); });
  }
  const tryPart = (card) => {
    if(S.busy) return;
    var i = parseInt(card.getAttribute("data-i"), 10);
    if(i !== S.placed){
      card.classList.add("shake");
      setTimeout(() => { card.classList.remove("shake"); }, 450);
      nudge(i < S.placed ? "That one's already in. We're on part " + (S.placed+1) + "." : "Step " + (i+1) + " first, friend. The picture is very specific.");
      tone(220, 180, 0.08, "square", 0.05);
      return;
    }
    S.placed++;
    var node = document.querySelector('.scene .p[data-i="' + i + '"]');
    if(node){ node.classList.add("on"); node.classList.add("pop"); setTimeout(() => { node.classList.remove("pop"); }, 500); }
    card.classList.add("done");
    tone(150, 70, 0.15, "sine", 0.14);
    document.getElementById("prog").textContent = S.placed + "/" + S.product.parts.length;
    if(S.placed === S.product.parts.length){
      nudge("All parts in. Now the second step.");
      document.getElementById("breathe").classList.add("show");
      var b = document.getElementById("breathe");
      b.scrollIntoView({behavior:"smooth", block:"center"});
    } else {
      nudge("Part " + (S.placed+1) + " next.");
    }
  }
  const nudge = (txt) => { var n = document.getElementById("nudge"); if(n) n.textContent = txt; }
  const breathe = () => {
    if(S.busy) return; S.busy = true;
    var btn = document.getElementById("breathe");
    btn.disabled = true; btn.textContent = "BREATHING...";
    whoosh();
    var bench = document.getElementById("bench");
    var fire = document.getElementById("fire");
    var flames = "";
    for(var i=0;i<9;i++){
      var left = 6 + Math.random()*88;
      var delay = (Math.random()*0.7).toFixed(2);
      var dur = (1.3 + Math.random()*0.6).toFixed(2);
      flames += '<span style="left:' + left + '%; animation-delay:' + delay + 's; animation-duration:' + dur + 's;">🔥</span>';
    }
    fire.innerHTML = flames;
    setTimeout(() => {
      bench.classList.add("glow");
      tone(300, 900, 0.5, "triangle", 0.1);
      setTimeout(() => {
        bench.classList.remove("glow");
        fire.innerHTML = "";
        tone(500, 800, 0.09, "triangle", 0.12);
        showFinish();
      }, 900);
    }, 400);
  }
  const showFinish = () => {
    var p = S.product;
    var f = document.getElementById("finish");
    f.innerHTML = '<div class="fname">' + p.name + '</div>' +
      '<div class="ftag">' + p.tagline + '</div>' +
      '<button class="bigbtn warm" id="tobag">GOES IN THE BAG</button>';
    f.classList.add("show");
    f.scrollIntoView({behavior:"smooth", block:"center"});
    document.getElementById("tobag").addEventListener("click", toBag);
  }
  const toBag = () => {
    var p = S.product;
    S.bag.push(p.id);
    tone(420, 640, 0.1, "triangle", 0.12);
    var bw = document.getElementById("bagwrap");
    bw.classList.remove("pop"); void bw.offsetWidth; bw.classList.add("pop");
    document.getElementById("bagcnt").textContent = S.bag.length + "/3";
    if(S.bag.length >= 3){ renderReceipt(); } else { renderStore(); }
  }

  const renderReceipt = () => {
    S.screen = "receipt";
    var rows = PRODUCTS.map((p) => {
      var ok = S.bag.indexOf(p.id) >= 0 ? "✓" : "—";
      return '<li><span>' + p.name + ' — ' + p.kind + '</span><span class="ok">' + ok + '</span></li>';
    }).join("");
    app.innerHTML = header() +
      '<div class="receipt">' +
        '<h2>FRAKTA RECEIPT</h2>' +
        '<ul class="items">' + rows + '</ul>' +
        '<div class="total"><span>TOTAL</span><span>12 coals</span></div>' +
        '<div class="note">"All parts were tested. Some broke. All are mine."</div>' +
        '<div class="marsh">' +
          '<div class="stick"><svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">' +
            '<rect x="10" y="0" width="12" height="90" rx="6" fill="#8a5a2b"/>' +
            '<rect x="30" y="14" width="40" height="44" rx="16" fill="#fff3df" id="marsh" stroke="#e8d5b5" stroke-width="3"/>' +
          '</svg></div>' +
          '<button class="bigbtn warm" id="toast">TOAST THE MARSHMALLOW</button>' +
          '<div class="toast" id="toastline">For the road.</div>' +
        '</div>' +
        '<button class="bigbtn again" id="again">RESTOCK THE SHELVES</button>' +
      '</div>' + footerHTML();
    document.getElementById("toast").addEventListener("click", () => {
      var m = document.getElementById("marsh");
      m.setAttribute("fill", "#e8b45e");
      document.getElementById("toastline").textContent = "Perfect. Not a single alarm went off.";
      tone(300, 120, 0.2, "sine", 0.1);
    });
    document.getElementById("again").addEventListener("click", () => {
      S.bag = []; S.product = null; S.placed = 0; S.busy = false; renderStore();
    });
  }

  renderStore();

  /* dev hook: ?dev=build&product=laga&auto=1 runs the full flow for screenshots */
  const qs = new URLSearchParams(location.search);
  if (qs.get("dev") === "build") {
    const want = qs.get("product") || "laga";
    const prod = PRODUCTS.find((x) => x.id === want);
    if (prod) {
      S.product = prod; S.placed = 0; S.busy = false; renderBuild();
      if (qs.get("auto") === "1") {
        const cards = document.querySelectorAll(".partcard");
        cards.forEach((c, i) => { tryPart(c); });
        setTimeout(() => { breathe(); }, 600);
      }
    }
  }
})();
</script>
</body>
</html>
