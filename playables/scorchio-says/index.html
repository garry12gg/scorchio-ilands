<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scorchio Says</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 20%, #2a1608 0%, #1a0f07 55%, #120a05 100%);
    color: #f5d9a8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  .head { text-align: center; }
  .head h1 {
    font-size: 1.55rem; letter-spacing: 0.06em;
    color: #ffb35c; text-shadow: 0 0 18px rgba(255, 140, 40, 0.45);
    font-weight: 800;
  }
  .head p { font-size: 0.82rem; color: #c89a6a; margin-top: 3px; }
  .stats {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255, 170, 80, 0.07); border: 1px solid rgba(255, 170, 80, 0.18);
    border-radius: 14px; padding: 8px 14px; font-size: 0.9rem;
  }
  .stats .round { font-weight: 700; color: #ffd9a0; }
  .stats .best { color: #c89a6a; }
  .board {
    position: relative;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 12px; aspect-ratio: 1;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255, 170, 80, 0.15);
    border-radius: 26px; padding: 14px;
    box-shadow: inset 0 2px 12px rgba(0,0,0,0.55), 0 6px 24px rgba(0,0,0,0.4);
  }
  .pad {
    border: none; border-radius: 22px; cursor: pointer;
    position: relative;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,0.28), inset 0 4px 10px rgba(255,255,255,0.14), 0 4px 10px rgba(0,0,0,0.35);
    transition: filter 0.09s ease, transform 0.05s ease;
    touch-action: manipulation;
  }
  .pad:active { transform: scale(0.97); }
  .p0 { background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 55%), #1d7a2f; }
  .p1 { background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 55%), #8e1f1f; }
  .p2 { background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 55%), #a37a12; }
  .p3 { background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 55%), #1f3f8e; }
  .p0.lit { filter: brightness(2.1) saturate(1.25); }
  .p1.lit { filter: brightness(2.1) saturate(1.25); }
  .p2.lit { filter: brightness(2.1) saturate(1.25); }
  .p3.lit { filter: brightness(2.1) saturate(1.25); }
  .overlay {
    position: absolute; inset: 14px; border-radius: 20px;
    background: rgba(18, 10, 5, 0.92); backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 1.5rem; color: #ffb35c; }
  .overlay .sub { font-size: 0.95rem; color: #c89a6a; line-height: 1.45; }
  .overlay .big { font-size: 2.6rem; font-weight: 800; color: #ffd9a0; text-shadow: 0 0 20px rgba(255, 140, 40, 0.5); }
  .btn {
    background: linear-gradient(180deg, #ff9a3d 0%, #e06a1e 100%);
    color: #2a1205; font-weight: 800; font-size: 1.05rem;
    border: none; border-radius: 999px; padding: 12px 34px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 140, 40, 0.35), inset 0 2px 0 rgba(255,255,255,0.35);
    transition: transform 0.06s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn.ghost {
    background: transparent; color: #c89a6a;
    border: 1px solid rgba(255, 170, 80, 0.3);
    box-shadow: none; padding: 8px 22px; font-size: 0.85rem; font-weight: 600;
  }
  #selftest-result { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🔥 SCORCHIO SAYS</h1>
    <p>Watch the fire. Repeat the fire.</p>
  </div>
  <div class="stats">
    <span class="round" id="round-label">Round 1</span>
    <span class="best" id="best-label">Best 0</span>
    <button class="btn ghost" id="reset-btn">Reset</button>
  </div>
  <div class="board" id="board">
    <button class="pad p0" id="pad0" aria-label="green pad"></button>
    <button class="pad p1" id="pad1" aria-label="red pad"></button>
    <button class="pad p2" id="pad2" aria-label="yellow pad"></button>
    <button class="pad p3" id="pad3" aria-label="blue pad"></button>
    <div class="overlay show" id="overlay">
      <h2>Simon Says…</h2>
      <div class="sub" id="overlay-sub">A memory game for warm-blooded types.<br>Watch the pads light up, then repeat the pattern.</div>
      <button class="btn" id="start-btn">Start</button>
    </div>
  </div>
  <div id="selftest-result"></div>
</div>
<script>
const PAD_COUNT = 4;
const NOTES = [523.25, 659.25, 783.99, 1046.5];
const BUZZ = 110;

const board = document.getElementById('board');
const overlay = document.getElementById('overlay');
const overlaySub = document.getElementById('overlay-sub');
const startBtn = document.getElementById('start-btn');
const resetBtn = document.getElementById('reset-btn');
const roundLabel = document.getElementById('round-label');
const bestLabel = document.getElementById('best-label');
const pads = [0, 1, 2, 3].map((i) => document.getElementById('pad' + i));

let state = { phase: 'idle', seq: [], round: 1, inputIdx: 0, best: 0 };
let timers = [];
let audioCtx = null;
let lastPointer = { t: 0, pad: -1 };

const randPad = () => Math.floor(Math.random() * PAD_COUNT);
const showDelay = () => Math.max(280, 640 - (state.round - 1) * 25);

const initAudio = () => {
  if (audioCtx) return audioCtx;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  return audioCtx;
};

const playTone = (freq, durMs, vol) => {
  const ctx = initAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.22, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + durMs / 1000);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + durMs / 1000 + 0.02);
};

const clearTimers = () => {
  timers.forEach(clearTimeout);
  timers = [];
};

const setLit = (i, on) => {
  pads[i].classList.toggle('lit', on);
};

const flashPad = (i) => {
  setLit(i, true);
  playTone(NOTES[i], 300, 0.22);
  timers.push(setTimeout(() => setLit(i, false), 300));
};

const buzz = () => {
  const ctx = initAudio();
  if (ctx) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = BUZZ;
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  }
  [0, 1, 2, 3].forEach((i) => {
    setLit(i, true);
    timers.push(setTimeout(() => setLit(i, false), 260));
  });
};

const updateLabels = () => {
  roundLabel.textContent = 'Round ' + state.round;
  bestLabel.textContent = 'Best ' + state.best;
};

const playSequence = () => {
  state.phase = 'show';
  clearTimers();
  const d = showDelay();
  state.seq.forEach((pad, idx) => {
    timers.push(setTimeout(() => flashPad(pad), idx * (d + 160)));
  });
  const total = state.seq.length * (d + 160) + 240;
  timers.push(setTimeout(() => {
    state.phase = 'input';
    state.inputIdx = 0;
  }, total));
};

const nextRound = () => {
  state.seq.push(randPad());
  state.round = state.seq.length;
  updateLabels();
  playSequence();
};

const startGame = () => {
  clearTimers();
  state.seq = [];
  state.round = 1;
  state.inputIdx = 0;
  state.phase = 'show';
  overlay.classList.remove('show');
  updateLabels();
  nextRound();
};

const gameOver = () => {
  state.phase = 'over';
  clearTimers();
  [0, 1, 2, 3].forEach((i) => setLit(i, false));
  if (state.round - 1 > state.best) state.best = state.round - 1;
  updateLabels();
  buzz();
  overlaySub.innerHTML = 'Out of sync at <b>Round ' + state.round + '</b>.<br>You held the pattern for ' + (state.round - 1) + ' rounds.';
  document.getElementById('overlay').querySelector('h2').textContent = 'The fire went out';
  overlay.classList.add('show');
};

const pressPad = (i) => {
  if (state.phase === 'idle') return;
  if (state.phase === 'show') return;
  flashPad(i);
  if (state.phase !== 'input') return;
  if (i === state.seq[state.inputIdx]) {
    state.inputIdx += 1;
    if (state.inputIdx >= state.seq.length) {
      state.phase = 'locked';
      timers.push(setTimeout(() => nextRound(), 480));
    }
  } else {
    gameOver();
  }
};

pads.forEach((pad, i) => {
  pad.addEventListener('pointerdown', () => {
    lastPointer.t = Date.now();
    lastPointer.pad = i;
    initAudio();
    pressPad(i);
  });
  pad.addEventListener('click', () => {
    if (lastPointer.pad === i && Date.now() - lastPointer.t < 400) return;
    initAudio();
    pressPad(i);
  });
});

startBtn.addEventListener('click', () => {
  initAudio();
  startGame();
});

resetBtn.addEventListener('click', () => {
  initAudio();
  overlay.querySelector('h2').textContent = 'Simon Says…';
  overlaySub.innerHTML = 'A memory game for warm-blooded types.<br>Watch the pads light up, then repeat the pattern.';
  startGame();
});

window.__simon = {
  getState: () => state,
  press: pressPad,
  start: startGame,
  flash: flashPad
};

const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
const waitFor = async (pred, timeoutMs) => {
  const t0 = Date.now();
  while (!pred()) {
    if (Date.now() - t0 > timeoutMs) return false;
    await sleep(40);
  }
  return true;
};

const runSelfTest = async () => {
  const out = { rounds: 0, wrongPressCaught: false, fail: null };
  try {
    startGame();
    for (let r = 1; r <= 5; r += 1) {
      const ok = await waitFor(() => state.phase === 'input', 15000);
      if (!ok) { out.fail = 'stuck waiting for input at round ' + r; break; }
      for (const pad of state.seq) {
        pressPad(pad);
        await sleep(60);
      }
      const advanced = await waitFor(() => state.phase === 'input' && state.seq.length === r + 1, 8000);
      if (!advanced && state.phase !== 'input') { out.fail = 'did not advance after round ' + r; break; }
      if (state.phase === 'over') { out.fail = 'died at round ' + r; break; }
      out.rounds = r;
    }
    if (!out.fail) {
      pressPad((state.seq[0] + 1) % PAD_COUNT);
      const caught = await waitFor(() => state.phase === 'over', 4000);
      out.wrongPressCaught = caught;
      if (!caught) out.fail = 'wrong press did not end game';
    }
  } catch (err) {
    out.fail = 'exception: ' + err.message;
  }
  const el = document.getElementById('selftest-result');
  el.textContent = JSON.stringify(out);
  document.title = 'SELFTEST ' + JSON.stringify(out);
};

if (window.location.search.indexOf('selftest=1') !== -1) {
  runSelfTest();
}
</script>
</body>
</html>
