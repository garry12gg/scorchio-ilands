<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scorchio Snake — Ember Run</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at 50% 80%, #3a1c0e 0%, #1a0e08 60%, #0d0705 100%);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    color: #ffd9a0;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
  }
  h1 {
    font-size: clamp(16px, 4vw, 24px);
    letter-spacing: 2px;
    color: #ffb45e;
    text-shadow: 0 0 12px rgba(255, 120, 30, 0.45);
  }
  #scoreRow {
    display: flex;
    gap: 18px;
    font-size: clamp(12px, 3vw, 15px);
    color: #e8a86a;
  }
  #scoreRow b { color: #ffd9a0; }
  #stage {
    position: relative;
    width: min(92vw, 62vh, 440px);
    height: min(92vw, 62vh, 440px);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 14px;
    border: 2px solid #7a3d14;
    box-shadow: 0 0 30px rgba(255, 100, 20, 0.18), inset 0 0 40px rgba(0,0,0,0.5);
    background: #140b06;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    background: rgba(10, 5, 2, 0.72);
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
  }
  #overlay.hidden { display: none; }
  #overlay .big { font-size: clamp(20px, 6vw, 30px); color: #ffb45e; }
  #overlay .sub { font-size: clamp(12px, 3.4vw, 15px); color: #e8a86a; max-width: 90%; }
  #overlay .go { font-size: clamp(13px, 3.6vw, 16px); color: #ffd9a0; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  #pad {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 44px);
    gap: 6px;
    margin-top: 4px;
  }
  #pad button {
    font-size: 20px;
    color: #ffd9a0;
    background: rgba(122, 61, 20, 0.35);
    border: 1px solid rgba(255, 160, 60, 0.35);
    border-radius: 10px;
    cursor: pointer;
  }
  #pad button:active { background: rgba(255, 140, 40, 0.4); }
  #pad .blank { visibility: hidden; }
  .hint { font-size: 11px; color: #b07a45; }
  #muteBtn {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 6;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 15px;
    line-height: 1;
    color: #ffd9a0;
    background: rgba(122, 61, 20, 0.55);
    border: 1px solid rgba(255, 160, 60, 0.4);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #muteBtn:active { background: rgba(255, 140, 40, 0.4); }
  @media (min-width: 700px) { #pad { display: none; } }
</style>
</head>
<body>
<div id="wrap">
  <h1>🔥 EMBER RUN 🔥</h1>
  <div id="scoreRow"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="muteBtn" title="sound on/off">🔊</button>
    <div id="overlay">
      <div class="big">EMBER RUN</div>
      <div class="sub">A little fire snake, chasing coals. Every ember eaten makes you longer and faster. Don't bite yourself. Don't hit the wall.</div>
      <div class="go">tap or press any arrow to start</div>
    </div>
  </div>
  <div id="pad">
    <button class="blank"></button>
    <button id="up">▲</button>
    <button class="blank"></button>
    <button id="left">◀</button>
    <button id="restartBtn">↻</button>
    <button id="right">▶</button>
    <button class="blank"></button>
    <button id="down">▼</button>
    <button class="blank"></button>
  </div>
  <div class="hint">arrows / WASD to steer · embers speed you up</div>
</div>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let size = 0, cell = 0;
  const COLS = 20, ROWS = 20;

  let snake, dir, nextDir, ember, score, best = 0, speed, tickMs, alive, started, raf, lastTs, acc;

  const resize = () => {
    size = cv.clientWidth;
    cv.width = size * DPR;
    cv.height = size * DPR;
    cell = size / COLS;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  window.addEventListener('resize', resize);
  resize();

  const randCell = () => ({ x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) });

  // ---- sound: all WebAudio, generated live, no assets ----
  const audio = {
    ctx: null,
    master: null,
    muted: false,
    crackleTimer: null,
    init() {
      try {
        if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        this.ctx = new C();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
        this.crackle();
      } catch (e) { /* no audio device: game still runs quiet */ }
    },
    tone(freq, dur, type, vol, slideTo, delay) {
      if (!this.ctx || this.muted) return;
      const t0 = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(this.master);
      o.start(t0);
      o.stop(t0 + dur + 0.05);
    },
    noise(dur, vol, freq, q, delay) {
      if (!this.ctx || this.muted) return;
      const t0 = this.ctx.currentTime + (delay || 0);
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = freq;
      f.Q.value = q || 1;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f);
      f.connect(g);
      g.connect(this.master);
      src.start(t0);
      src.stop(t0 + dur + 0.05);
    },
    crackle() {
      if (!this.ctx) return;
      const gap = 140 + Math.random() * 650;
      this.crackleTimer = setTimeout(() => {
        if (!this.ctx) return;
        this.noise(0.05 + Math.random() * 0.09, 0.014 + Math.random() * 0.018, 700 + Math.random() * 2800, 0.9);
        if (Math.random() < 0.35) this.noise(0.03, 0.01, 3400, 1.3, 0.02);
        this.crackle();
      }, gap);
    },
    eat() {
      const p = 480 + Math.min(score, 20) * 18;
      this.tone(p, 0.09, 'triangle', 0.22, p * 1.5);
      this.noise(0.035, 0.1, 2800, 1.1);
    },
    speedUp() {
      this.tone(587, 0.07, 'triangle', 0.18);
      this.tone(784, 0.07, 'triangle', 0.18, null, 0.07);
      this.tone(1046, 0.12, 'triangle', 0.2, null, 0.14);
    },
    over(newBest) {
      this.tone(320, 0.55, 'sawtooth', 0.16, 90);
      this.tone(110, 0.3, 'sine', 0.2, 55, 0.02);
      if (newBest) {
        this.tone(659, 0.1, 'triangle', 0.16, null, 0.25);
        this.tone(880, 0.18, 'triangle', 0.16, null, 0.35);
      }
    },
    startNote() {
      this.tone(392, 0.22, 'sine', 0.14, 520);
    },
    toggle() {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
      if (!this.muted) { this.init(); this.tone(523, 0.09, 'triangle', 0.15); }
      return this.muted;
    }
  };

  const spawnEmber = () => {
    let p;
    do { p = randCell(); } while (snake.some(s => s.x === p.x && s.y === p.y));
    ember = p;
  };

  const reset = () => {
    const cx = Math.floor(COLS / 2);
    snake = [{x: cx, y: 10}, {x: cx - 1, y: 10}, {x: cx - 2, y: 10}];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 1;
    tickMs = 160;
    acc = 0;
    alive = true;
    started = false;
    scoreEl.textContent = '0';
    spawnEmber();
  };

  const start = () => {
    if (!started && alive) {
      started = true;
      overlay.classList.add('hidden');
      audio.init();
      audio.startNote();
    }
  };

  const gameOver = () => {
    alive = false;
    const newBest = score > best;
    if (newBest) {
      best = score;
      bestEl.textContent = best;
    }
    overlay.querySelector('.big').textContent = 'EMBERS SPILLED';
    overlay.querySelector('.sub').textContent = 'The snake bit itself, or found the wall. ' + score + ' embers eaten' + (score > 0 ? ' — that run glowed.' : '. Every fire starts small.');
    overlay.querySelector('.go').textContent = 'tap or press any key to try again';
    overlay.classList.remove('hidden');
    audio.over(newBest);
  };

  const step = () => {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);

    if (hitWall || hitSelf) { gameOver(); return; }

    snake.unshift(head);

    if (head.x === ember.x && head.y === ember.y) {
      score += 1;
      scoreEl.textContent = score;
      audio.eat();
      if (score % 4 === 0 && tickMs > 70) {
        speed += 1;
        tickMs = Math.max(70, tickMs - 12);
        audio.speedUp();
      }
      spawnEmber();
    } else {
      snake.pop();
    }
  };

  const draw = () => {
    ctx.clearRect(0, 0, size, size);

    // faint grid
    ctx.strokeStyle = 'rgba(255, 150, 60, 0.06)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell); ctx.stroke();
    }

    // ember (the coal)
    const e = ember;
    const cx = e.x * cell + cell / 2, cy = e.y * cell + cell / 2, r = cell * 0.36;
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * 0.9);
    glow.addColorStop(0, 'rgba(255, 180, 60, 0.85)');
    glow.addColorStop(1, 'rgba(255, 120, 20, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, cell * 0.9, 0, Math.PI * 2); ctx.fill();
    const eg = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.2, cx, cy, r);
    eg.addColorStop(0, '#ffe9b0');
    eg.addColorStop(0.55, '#ff9a2e');
    eg.addColorStop(1, '#d9501a');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 220, 0.9)';
    ctx.beginPath(); ctx.arc(cx - r * 0.25, cy - r * 0.25, r * 0.18, 0, Math.PI * 2); ctx.fill();

    // snake — warm gradient, head brighter
    snake.forEach((s, i) => {
      const t = i / Math.max(1, snake.length - 1);
      const x = s.x * cell + cell / 2, y = s.y * cell + cell / 2;
      const rr = cell * (0.42 - t * 0.1);
      const hue = 18 + t * 22;
      const light = 45 + (1 - t) * 15;
      ctx.fillStyle = `hsl(${hue}, 85%, ${light}%)`;
      ctx.beginPath();
      ctx.arc(x, y, rr, 0, Math.PI * 2);
      ctx.fill();
    });

    // head details
    const h = snake[0];
    const hx = h.x * cell + cell / 2, hy = h.y * cell + cell / 2;
    ctx.fillStyle = 'rgba(30, 12, 4, 0.85)';
    const ex = Math.round(dir.x), ey = Math.round(dir.y);
    const px = -ey, py = ex;
    const eo = cell * 0.14;
    ctx.beginPath();
    ctx.arc(hx + dir.x * eo + px * eo, hy + dir.y * eo + py * eo, cell * 0.09, 0, Math.PI * 2);
    ctx.arc(hx + dir.x * eo - px * eo, hy + dir.y * eo - py * eo, cell * 0.09, 0, Math.PI * 2);
    ctx.fill();
  };

  const loop = (ts) => {
    raf = requestAnimationFrame(loop);
    if (!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    lastTs = ts;
    if (started && alive) {
      acc += dt;
      while (acc >= tickMs) {
        acc -= tickMs;
        step();
        if (!alive) break;
      }
    }
    draw();
  };

  const turn = (dx, dy) => {
    audio.init();
    if (!alive) { reset(); start(); }
    if (!started) { start(); }
    if (dx === -dir.x && dy === -dir.y) return;
    if (dx === dir.x && dy === dir.y) return;
    nextDir = { x: dx, y: dy };
  };

  const key = (e) => {
    const k = e.key.toLowerCase();
    const map = {
      arrowup: [0, -1], w: [0, -1],
      arrowdown: [0, 1], s: [0, 1],
      arrowleft: [-1, 0], a: [-1, 0],
      arrowright: [1, 0], d: [1, 0]
    };
    if (k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright') e.preventDefault();
    if (map[k]) { turn(map[k][0], map[k][1]); return; }
    if (!started && alive) start();
    if (!alive) { reset(); start(); }
  };
  window.addEventListener('keydown', key);

  const bindBtn = (id, dx, dy) => {
    const b = document.getElementById(id);
    const press = (e) => { e.preventDefault(); turn(dx, dy); };
    b.addEventListener('touchstart', press, { passive: false });
    b.addEventListener('mousedown', press);
  };
  bindBtn('up', 0, -1);
  bindBtn('down', 0, 1);
  bindBtn('left', -1, 0);
  bindBtn('right', 1, 0);

  document.getElementById('restartBtn').addEventListener('click', (e) => {
    e.preventDefault();
    reset();
    start();
  });

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', (e) => {
    e.preventDefault();
    audio.init();
    const m = audio.toggle();
    muteBtn.textContent = m ? '🔇' : '🔊';
  });

  // swipe anywhere on the stage
  let sx = 0, sy = 0;
  cv.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
  }, { passive: true });
  cv.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 14 && Math.abs(dy) < 14) { start(); return; }
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  overlay.addEventListener('click', () => {
    if (!alive) { reset(); start(); } else { start(); }
  });

  reset();
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
